<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="Pierre Santos — Site Reliability Engineer, Cloud Infrastructure e Observabilidade.">
<title>Pierre Santos | SRE & Cloud</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--text:#e8eef8;--muted:#a9b7ca;--accent:#73b7ff;--line:#26364c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1220,#101b2c 55%,#0b1220);color:var(--text);font:16px/1.7 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;background:#0b1220eF;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);z-index:5}
nav{max-width:1000px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:850;letter-spacing:.3px;color:#fff;text-decoration:none}.brand span{color:var(--accent)}
nav a:last-child{background:#1e4e7d;color:#fff;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px}
main{max-width:1000px;margin:42px auto;padding:0 22px 70px}
.intro{padding:30px;background:linear-gradient(130deg,#15243a,#101a2a);border:1px solid var(--line);border-radius:18px;margin-bottom:28px}
.kicker{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(34px,6vw,54px);line-height:1.08;margin:8px 0 12px}
.sub{color:var(--muted);margin:0}
#readme{background:#0f1929;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,42px);overflow-wrap:anywhere}
#readme h1,#readme h2,#readme h3{line-height:1.2;margin-top:1.5em}
#readme h1{font-size:2em}#readme h2{font-size:1.55em;border-bottom:1px solid var(--line);padding-bottom:.35em}
#readme a{color:#83c5ff}#readme img{max-width:100%;height:auto;border-radius:8px}
#readme pre{overflow:auto;background:#08111e;padding:14px;border-radius:8px}
#readme code{background:#1b2a40;padding:2px 5px;border-radius:4px}
#readme blockquote{border-left:3px solid var(--accent);padding-left:16px;color:var(--muted)}
#readme table{display:block;overflow-x:auto;border-collapse:collapse}#readme td,#readme th{border:1px solid var(--line);padding:8px}
footer{max-width:1000px;margin:auto;padding:0 22px 36px;color:var(--muted);font-size:13px}
@media(max-width:600px){nav{padding:12px 16px}main{margin:22px auto;padding:0 14px 48px}.intro{padding:22px}#readme{padding:18px}}
</style>
</head>
<body>
<header><nav><a class="brand" href="/">PIERRE <span>SANTOS</span></a><a href="./fotografia/">📸 MagFoto — Fotografia & Drone</a></nav></header>
<main>
<section class="intro"><div class="kicker">Site profissional</div><h1>Pierre Santos</h1><p class="sub">Site Reliability Engineer · Cloud Infrastructure · Observability</p></section>
<article id="readme"><p>Carregando conteúdo do README.md…</p></article>
</main>
<footer>Conteúdo profissional mantido no <a href="https://github.com/pmagaiwer/site/blob/main/README.md" style="color:#83c5ff">README do GitHub</a>.</footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(async()=>{const target=document.getElementById('readme');try{const response=await fetch('https://raw.githubusercontent.com/pmagaiwer/site/main/README.md');if(!response.ok)throw new Error('Não foi possível carregar o README');const markdown=await response.text();target.innerHTML=marked.parse(markdown,{gfm:true,breaks:false});}catch(e){target.innerHTML='<p>Não foi possível carregar o README automaticamente. <a href="https://github.com/pmagaiwer/site/blob/main/README.md">Acesse o README diretamente no GitHub.</a></p>';}})();
</script>
</body>
</html>
